<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05080d">
<title>动态目标追踪</title>
<style>
:root{
  color-scheme:dark;
  --bg:#05080d;
  --panel:rgba(8,14,22,.82);
  --line:rgba(190,215,240,.22);
  --text:#eaf2fb;
  --muted:#9aadc2;
  --accent:#66e3c4;
  --warn:#ffd166;
}
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--text);
  touch-action:manipulation;
}
body{
  position:fixed;
  inset:0;
}
#app{
  position:absolute;
  inset:0;
  overflow:hidden;
  background:#000;
}
#stage{
  position:absolute;
  inset:0;
  overflow:hidden;
  background:#000;
}
#media{
  position:absolute;
  inset:0;
  transform-origin:center center;
  will-change:transform;
}
#video,#overlay{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
}
#video{
  background:#000;
}
#overlay{
  pointer-events:none;
}
#shade{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(
    180deg,
    rgba(0,0,0,.42),
    transparent 24%,
    transparent 68%,
    rgba(0,0,0,.5)
  );
}
.topbar{
  position:absolute;
  top:max(12px,env(safe-area-inset-top));
  left:14px;
  right:14px;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  pointer-events:none;
}
.brand,.status{
  background:var(--panel);
  border:1px solid var(--line);
  backdrop-filter:blur(14px);
  border-radius:14px;
  padding:10px 13px;
  box-shadow:0 8px 24px #0004;
}
.brand strong{
  display:block;
  font-size:13px;
  letter-spacing:.12em;
  font-weight:750;
}
.brand span,.status span{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}
.status{
  text-align:right;
  min-width:118px;
}
.status strong{
  font-size:12px;
  font-weight:650;
}
.controls{
  position:absolute;
  right:max(14px,env(safe-area-inset-right));
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:10px;
  width:112px;
}
button{
  font:inherit;
  color:var(--text);
  border:1px solid var(--line);
  background:var(--panel);
  backdrop-filter:blur(14px);
  border-radius:14px;
  min-height:48px;
  padding:9px 10px;
  cursor:pointer;
}
button:active{
  transform:scale(.98);
}
button.primary{
  border-color:rgba(102,227,196,.65);
  background:rgba(16,65,60,.88);
}
button.active{
  border-color:var(--accent);
  box-shadow:inset 0 0 0 1px var(--accent);
  color:var(--accent);
}
button:disabled{
  opacity:.4;
}
.btn-title{
  display:block;
  font-size:13px;
  font-weight:700;
}
.btn-sub{
  display:block;
  font-size:10px;
  color:var(--muted);
  margin-top:3px;
}
.bottom{
  position:absolute;
  left:14px;
  right:142px;
  bottom:max(14px,env(safe-area-inset-bottom));
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:10px;
  pointer-events:none;
}
.info{
  max-width:min(66vw,430px);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px 13px;
  backdrop-filter:blur(14px);
}
.info strong{
  display:block;
  font-size:12px;
}
.info p{
  margin:4px 0 0;
  font-size:11px;
  line-height:1.45;
  color:var(--muted);
}
.mini{
  font-size:10px;
  color:var(--muted);
  text-align:right;
  line-height:1.55;
}
#permission{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:radial-gradient(
    ellipse at center,
    #17232e,
    #05080d 72%
  );
  z-index:5;
}
.card{
  width:min(440px,100%);
  padding:25px;
  border:1px solid var(--line);
  border-radius:22px;
  background:rgba(8,14,22,.94);
  box-shadow:0 24px 70px #0008;
}
.card h1{
  margin:0 0 10px;
  font-size:22px;
}
.card p{
  font-size:13px;
  color:var(--muted);
  line-height:1.65;
}
.card button{
  width:100%;
  margin-top:10px;
}
#error{
  color:#ffb4a9;
}
#aim{
  position:absolute;
  left:50%;
  top:50%;
  width:22px;
  height:22px;
  transform:translate(-50%,-50%);
  pointer-events:none;
  opacity:.55;
}
#aim:before,#aim:after{
  content:"";
  position:absolute;
  background:#dce9f4;
}
#aim:before{
  width:1px;
  height:22px;
  left:10px;
  top:0;
}
#aim:after{
  height:1px;
  width:22px;
  top:10px;
  left:0;
}
@media (orientation:portrait){
  .topbar{
    top:10px;
  }
  .controls{
    right:10px;
    width:100px;
  }
  .bottom{
    left:10px;
    right:120px;
    bottom:10px;
  }
  .brand strong{
    font-size:11px;
  }
}
</style>
</head><body>
<div id="app">

  <div id="stage">
    <div id="media">
      <video
        id="video"
        autoplay
        muted
        playsinline>
      </video>

      <canvas id="overlay"></canvas>
    </div>

    <div id="shade"></div>
    <div id="aim"></div>
  </div>

  <div class="topbar">
    <div class="brand">
      <strong>VISUAL TRACKING</strong>
      <span>本地视觉 · 实时目标追踪</span>
    </div>

    <div class="status">
      <strong id="state">等待启动</strong>
      <span id="fps">检测器未运行</span>
    </div>
  </div>

  <div class="controls">

    <button id="lockBtn" class="primary">
      <span class="btn-title">锁定目标</span>
      <span class="btn-sub">点选画面中的目标</span>
    </button>

    <button id="zoomBtn">
      <span class="btn-title">动态变焦</span>
      <span class="btn-sub">独立开关 · 关闭</span>
    </button>

    <button id="clearBtn">
      <span class="btn-title">取消锁定</span>
      <span class="btn-sub">恢复自由追踪</span>
    </button>

    <button id="zoomMinus">
      <span class="btn-title">缩小画面</span>
      <span class="btn-sub">当前 1.0×</span>
    </button>

    <button id="zoomPlus">
      <span class="btn-title">放大画面</span>
      <span class="btn-sub">最高 3.0×</span>
    </button>

  </div>

  <div class="bottom">
    <div class="info">
      <strong id="targetTitle">尚未选择目标</strong>
      <p id="detail">
        启动摄像头后，画面中的可识别物体会显示追踪框。点击物体可锁定。
      </p>
    </div>

    <div class="mini" id="metrics">
      AI：本地推理<br>
      测距：不可用
    </div>
  </div>

  <div id="permission">
    <div class="card">

      <h1>动态目标追踪</h1>

      <p>
        使用后置摄像头与本地 COCO-SSD 模型进行目标检测和追踪。
        检测结果仅用于视觉分析；距离数值不会伪装成真实测距。
      </p>

      <p id="error"></p>

      <button id="startBtn" class="primary">
        启动摄像头与 AI
      </button>

      <p>
        首次启动需要摄像头权限。
        请确认本地存在 tf.min.js、coco.min.js 和 model/model.json。
      </p>

    </div>
  </div>

</div>

<script src="tf.min.js"></script>
<script src="coco.min.js"></script>

<script>
(() => {
'use strict';

const $ = id => document.getElementById(id);

const video = $('video');
const canvas = $('overlay');
const ctx = canvas.getContext('2d', { alpha: true });
const media = $('media');

let model = null;
let stream = null;
let running = false;
let busy = false;
let raf = 0;

let lastDetect = 0;
let frames = 0;
let fps = 0;
let fpsAt = performance.now();

let tracks = [];
let nextId = 1;
let lockedId = null;
let lockMode = false;

let dynamicZoom = false;
let zoom = 1;

let lastInferMs = 0;
let errorCount = 0;
let lastDetections = [];

const DETECT_INTERVAL = 180;
const MAX_MISSED = 12;

const clamp = (v, a, b) =>
  Math.max(a, Math.min(b, v));

const area = b =>
  Math.max(0, b[2]) * Math.max(0, b[3]);

function center(b) {
  return [
    b[0] + b[2] / 2,
    b[1] + b[3] / 2
  ];
}

function dist(a, b) {
  const ca = center(a);
  const cb = center(b);

  return Math.hypot(
    ca[0] - cb[0],
    ca[1] - cb[1]
  );
}

function iou(a, b) {
  const x1 = Math.max(a[0], b[0]);
  const y1 = Math.max(a[1], b[1]);

  const x2 = Math.min(
    a[0] + a[2],
    b[0] + b[2]
  );

  const y2 = Math.min(
    a[1] + a[3],
    b[1] + b[3]
  );

  const inter =
    Math.max(0, x2 - x1) *
    Math.max(0, y2 - y1);

  return inter /
    (area(a) + area(b) - inter + 1e-6);
}

function resizeCanvas() {
  const w = video.videoWidth || 1280;
  const h = video.videoHeight || 720;

  if (
    canvas.width !== w ||
    canvas.height !== h
  ) {
    canvas.width = w;
    canvas.height = h;
  }
}

function setZoom() {
  media.style.transform =
    `scale(${zoom.toFixed(2)})`;

  $('zoomMinus')
    .querySelector('.btn-sub')
    .textContent = `当前 ${zoom.toFixed(1)}×`;

  $('zoomPlus')
    .querySelector('.btn-sub')
    .textContent = '最高 3.0×';
}

function updateButtons() {
  $('lockBtn')
    .classList.toggle('active', lockMode);

  $('lockBtn')
    .querySelector('.btn-sub')
    .textContent =
      lockedId !== null
        ? `已锁定 #${lockedId}`
        : (
            lockMode
              ? '点选目标'
              : '点选画面中的目标'
          );

  $('zoomBtn')
    .classList.toggle('active', dynamicZoom);

  $('zoomBtn')
    .querySelector('.btn-sub')
    .textContent =
      `独立开关 · ${dynamicZoom ? '开启' : '关闭'}`;
}

function updateStatus(text, sub) {
  $('state').textContent = text;
  $('fps').textContent = sub;
}

function setLocked(id) {
  lockedId = id;
  lockMode = id !== null;

  updateButtons();

  if (id === null) {
    $('targetTitle').textContent =
      '尚未选择目标';

    $('detail').textContent =
      '已取消目标锁定，继续显示所有检测到的物体。';

  } else {
    const t = tracks.find(x => x.id === id);

    $('targetTitle').textContent =
      t ? `${t.label} · 目标 #${id}` : `目标 #${id}`;

    $('detail').textContent =
      '锁定保持在同一追踪 ID；目标短暂离开画面时会尝试恢复。';
  }
}function updateTrack(dets) {
  const candidates = [];

  // 第一阶段：计算现有轨迹与新检测目标之间的匹配分数。
  for (let ti = 0; ti < tracks.length; ti++) {
    for (let di = 0; di < dets.length; di++) {
      const t = tracks[ti];
      const d = dets[di];

      // 优先匹配类别一致的目标。
      if (t.label !== d.class) {
        continue;
      }

      const overlap = iou(t.box, d.bbox);

      const normalizedDistance =
        dist(t.box, d.bbox) /
        Math.max(
          40,
          Math.hypot(t.box[2], t.box[3])
        );

      // 有明显重叠，或距离仍在合理范围内，才参与匹配。
      if (
        overlap > 0.01 ||
        normalizedDistance < 1.25
      ) {
        const score =
          overlap * 2.2 -
          normalizedDistance * 0.7 +
          (d.score || 0) * 0.05;

        candidates.push({
          ti,
          di,
          score
        });
      }
    }
  }

  // 分数高的匹配优先。
  candidates.sort(
    (a, b) => b.score - a.score
  );

  const assignedT = new Set();
  const assignedD = new Set();

  // 第二阶段：进行一对一匹配，避免一个目标被重复分配。
  for (const c of candidates) {
    if (
      assignedT.has(c.ti) ||
      assignedD.has(c.di)
    ) {
      continue;
    }

    const t = tracks[c.ti];
    const d = dets[c.di];

    t.prevBox = t.box.slice();
    t.box = d.bbox.slice();

    t.score = d.score;
    t.missed = 0;
    t.hits++;
    t.age++;
    t.lastSeen = performance.now();

    assignedT.add(c.ti);
    assignedD.add(c.di);
  }

  // 第三阶段：对本帧没有匹配成功的目标，短暂保留预测位置。
  tracks.forEach((t, i) => {
    if (assignedT.has(i)) {
      return;
    }

    t.missed++;
    t.age++;

    if (t.missed <= 3) {
      t.box[0] += t.velocity[0];
      t.box[1] += t.velocity[1];
    }
  });

  // 第四阶段：根据匹配前后的位置更新运动速度估计。
  for (const c of candidates) {
    if (
      !assignedT.has(c.ti) ||
      !assignedD.has(c.di)
    ) {
      continue;
    }

    const t = tracks[c.ti];

    if (t.prevBox) {
      t.velocity = [
        (t.box[0] - t.prevBox[0]) * 0.65 +
          t.velocity[0] * 0.35,

        (t.box[1] - t.prevBox[1]) * 0.65 +
          t.velocity[1] * 0.35
      ];
    }
  }

  // 第五阶段：AI 检测到、但尚未匹配到轨迹的目标，独立创建轨迹。
  for (let i = 0; i < dets.length; i++) {
    if (assignedD.has(i)) {
      continue;
    }

    const d = dets[i];

    tracks.push({
      id: nextId++,
      label: d.class,
      box: d.bbox.slice(),
      score: d.score,
      missed: 0,
      hits: 1,
      age: 1,
      lastSeen: performance.now(),
      velocity: [0, 0]
    });
  }

  // 清除长期未检测到的轨迹。
  tracks = tracks.filter(
    t => t.missed <= MAX_MISSED
  );

  // 如果锁定目标已被清除，解除锁定。
  if (
    lockedId !== null &&
    !tracks.some(t => t.id === lockedId)
  ) {
    lockedId = null;
    lockMode = false;

    updateButtons();

    $('targetTitle').textContent =
      '锁定目标已丢失';

    $('detail').textContent =
      '目标持续未出现，锁定已解除。请重新选择目标。';
  }

  lastDetections = dets;
}

function draw() {
  if (!canvas.width || !canvas.height) {
    return;
  }

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  for (const t of tracks) {
    // 丢失时间较长的轨迹暂不绘制。
    if (t.missed > 4) {
      continue;
    }

    const [x, y, w, h] = t.box;
    const locked = t.id === lockedId;

    ctx.save();

    ctx.lineWidth = locked
      ? Math.max(3, canvas.width / 500)
      : Math.max(2, canvas.width / 800);

    ctx.strokeStyle = locked
      ? '#66e3c4'
      : (
          t.missed
            ? 'rgba(255,209,102,.75)'
            : 'rgba(110,205,255,.9)'
        );

    // 丢失中的目标使用虚线框。
    ctx.setLineDash(
      t.missed ? [8, 6] : []
    );

    ctx.strokeRect(x, y, w, h);

    ctx.setLineDash([]);

    const label =
      `${t.label}  ${(t.score * 100).toFixed(0)}%` +
      (t.missed ? ' · 恢复中' : '');

    const fontSize = Math.max(
      15,
      canvas.width / 75
    );

    ctx.font = `${fontSize}px system-ui`;

    const textWidth =
      ctx.measureText(label).width;

    const labelHeight = Math.max(
      25,
      canvas.width / 45
    );

    const labelY = Math.max(
      0,
      y - labelHeight
    );

    ctx.fillStyle = locked
      ? 'rgba(12,70,60,.92)'
      : 'rgba(5,15,24,.85)';

    ctx.fillRect(
      x,
      labelY,
      textWidth + 14,
      labelHeight
    );

    ctx.fillStyle = locked
      ? '#a8ffea'
      : '#eaf2fb';

    ctx.fillText(
      label,
      x + 7,
      labelY + labelHeight - 7
    );

    // 被锁定的目标额外显示四角标记。
    if (locked) {
      const l = Math.min(w, h) * 0.18;

      ctx.lineWidth = Math.max(
        3,
        canvas.width / 400
      );

      ctx.beginPath();

      ctx.moveTo(x, y + l);
      ctx.lineTo(x, y);
      ctx.lineTo(x + l, y);

      ctx.moveTo(x + w - l, y);
      ctx.lineTo(x + w, y);
      ctx.lineTo(x + w, y + l);

      ctx.moveTo(x, y + h - l);
      ctx.lineTo(x, y + h);
      ctx.lineTo(x + l, y + h);

      ctx.moveTo(x + w - l, y + h);
      ctx.lineTo(x + w, y + h);
      ctx.lineTo(x + w, y + h - l);

      ctx.stroke();
    }

    ctx.restore();
  }

  // 更新锁定目标信息。
  const locked = tracks.find(
    t => t.id === lockedId
  );

  if (locked) {
    $('targetTitle').textContent =
      `${locked.label} · 目标 #${locked.id}`;

    $('detail').textContent =
      `置信度 ${(locked.score * 100).toFixed(0)}% · ` +
      (
        locked.missed
          ? '短暂未检出，正在尝试恢复'
          : '持续追踪中'
      ) +
      ` · 画面缩放 ${zoom.toFixed(1)}×`;
  }

  $('metrics').innerHTML =
    `AI：本地推理<br>` +
    `单帧推理：${lastInferMs.toFixed(0)} ms<br>` +
    `测距：未提供真实深度传感器`;
}

function pickTarget(ev) {
  if (!lockMode) {
    return;
  }

  const rect = canvas.getBoundingClientRect();

  const vw = video.videoWidth;
  const vh = video.videoHeight;

  if (!vw || !vh) {
    return;
  }

  // 计算 object-fit: contain 产生的留白。
  const scale = Math.min(
    rect.width / vw,
    rect.height / vh
  );

  const dw = vw * scale;
  const dh = vh * scale;

  const left =
    rect.left + (rect.width - dw) / 2;

  const top =
    rect.top + (rect.height - dh) / 2;

  const px = (ev.clientX - left) / scale;
  const py = (ev.clientY - top) / scale;

  let best = null;
  let bestScore = Infinity;

  // 点击多个重叠框时，优先选择面积较小的框。
  for (const t of tracks) {
    if (t.missed > 2) {
      continue;
    }

    const b = t.box;

    const inside =
      px >= b[0] &&
      px <= b[0] + b[2] &&
      py >= b[1] &&
      py <= b[1] + b[3];

    if (inside) {
      const s = area(b);

      if (s < bestScore) {
        best = t;
        bestScore = s;
      }
    }
  }

  if (best) {
    setLocked(best.id);
  }
}

canvas.addEventListener(
  'click',
  pickTarget
);// 锁定按钮：进入目标选择模式，或取消当前锁定。
$('lockBtn').addEventListener('click', () => {
  if (lockedId !== null) {
    setLocked(null);
    return;
  }

  lockMode = !lockMode;

  updateButtons();

  $('detail').textContent = lockMode
    ? '请直接点击画面中要锁定的目标。'
    : '点按“锁定目标”后，再点击画面中的目标。';
});

// 取消锁定。
$('clearBtn').addEventListener('click', () => {
  setLocked(null);
});

// 动态变焦是独立开关，不强制要求先锁定目标。
$('zoomBtn').addEventListener('click', () => {
  dynamicZoom = !dynamicZoom;
  updateButtons();
});

// 手动放大。
$('zoomPlus').addEventListener('click', () => {
  zoom = clamp(zoom + 0.25, 1, 3);
  setZoom();
});

// 手动缩小。
$('zoomMinus').addEventListener('click', () => {
  zoom = clamp(zoom - 0.25, 1, 3);
  setZoom();
});

// 摄像头与 AI 初始化。
$('startBtn').addEventListener('click', async () => {
  $('startBtn').disabled = true;
  $('error').textContent = '';

  try {
    // 检查本地 AI 脚本是否存在。
    if (!window.tf || !window.cocoSsd) {
      throw new Error(
        '未找到本地 TensorFlow.js 或 COCO-SSD 脚本。' +
        '请检查 tf.min.js 和 coco.min.js。'
      );
    }

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {
      throw new Error(
        '当前环境不支持摄像头 API，请检查 Android WebView 配置。'
      );
    }

    // 优先请求后置摄像头。
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: {
          ideal: 'environment'
        },
        width: {
          ideal: 1920
        },
        height: {
          ideal: 1080
        },
        frameRate: {
          ideal: 30,
          max: 30
        }
      }
    });

    video.srcObject = stream;

    // 等待摄像头视频尺寸可用。
    await new Promise((resolve, reject) => {
      let settled = false;

      const finish = (fn, value) => {
        if (settled) {
          return;
        }

        settled = true;
        clearTimeout(timer);

        video.onloadedmetadata = null;
        video.onerror = null;

        fn(value);
      };

      const timer = setTimeout(() => {
        finish(
          reject,
          new Error('摄像头启动超时')
        );
      }, 12000);

      video.onloadedmetadata = () => {
        finish(resolve);
      };

      video.onerror = () => {
        finish(
          reject,
          new Error('无法读取摄像头视频')
        );
      };

      if (video.readyState >= 1) {
        finish(resolve);
      }
    });

    await video.play();

    resizeCanvas();

    updateStatus(
      '加载本地 AI',
      '首次加载可能需要一些时间'
    );

    // 初始化 TensorFlow.js。
    await tf.ready();

    // 加载本地 COCO-SSD 模型。
    // 模型文件及其权重分片必须存在于项目内。
    model = await cocoSsd.load({
      base: 'lite_mobilenet_v2',
      modelUrl: 'model/model.json'
    });

    // 初始化成功后显示摄像头画面。
    $('permission').style.display = 'none';

    running = true;

    updateStatus(
      '检测运行中',
      'AI 模型已加载'
    );

    lastDetect = 0;
    fpsAt = performance.now();
    frames = 0;

    raf = requestAnimationFrame(detectLoop);

  } catch (e) {
    console.error(e);

    $('error').textContent =
      `启动失败：${e.message || e}。` +
      '请确认摄像头权限、运行环境以及模型文件路径。';

    $('startBtn').disabled = false;

    updateStatus(
      '启动失败',
      '检查模型与摄像头'
    );

    if (stream) {
      stream.getTracks().forEach(track => {
        track.stop();
      });

      stream = null;
      video.srcObject = null;
    }
  }
});

// 实时检测循环。
async function detectLoop() {
  if (!running) {
    return;
  }

  const now = performance.now();

  // AI 正在推理时，不重复发起推理任务。
  if (
    !busy &&
    model &&
    video.readyState >= 2 &&
    now - lastDetect >= DETECT_INTERVAL
  ) {
    busy = true;
    lastDetect = now;

    try {
      resizeCanvas();

      const t0 = performance.now();

      // 直接在视频帧上运行目标检测。
      // maxNumBoxes 为 30，scoreThreshold 为 0.42。
      const dets = await model.detect(
        video,
        30,
        0.42
      );

      lastInferMs = performance.now() - t0;

      updateTrack(dets);

      errorCount = 0;

    } catch (e) {
      errorCount++;

      if (errorCount === 1) {
        console.error(
          'AI 检测失败：',
          e
        );
      }

    } finally {
      busy = false;
    }
  }

  // 绘制当前追踪状态。
  draw();

  frames++;

  // 每秒更新一次 FPS。
  if (now - fpsAt >= 1000) {
    fps = frames * 1000 / (now - fpsAt);

    frames = 0;
    fpsAt = now;

    updateStatus(
      lockedId === null
        ? '检测运行中'
        : '目标锁定中',
      `${fps.toFixed(0)} FPS · ${tracks.length} 个目标`
    );
  }

  // 动态变焦与目标锁定独立。
  // 仅当存在锁定目标时，自动变焦才根据其大小调整。
  if (
    dynamicZoom &&
    lockedId !== null
  ) {
    const t = tracks.find(
      x => x.id === lockedId
    );

    if (t && t.missed === 0) {
      const wanted = clamp(
        Math.min(
          canvas.width / Math.max(1, t.box[2]) * 0.58,
          canvas.height / Math.max(1, t.box[3]) * 0.58
        ),
        1,
        2.7
      );

      // 平滑调整缩放比例，降低突变。
      zoom = clamp(
        zoom * 0.88 + wanted * 0.12,
        1,
        3
      );

      setZoom();
    }
  }

  raf = requestAnimationFrame(detectLoop);
}

// 窗口尺寸发生变化时更新画布。
window.addEventListener('resize', () => {
  resizeCanvas();
});

// 屏幕方向变化后重新读取视频尺寸。
window.addEventListener(
  'orientationchange',
  () => {
    setTimeout(() => {
      resizeCanvas();
    }, 300);
  }
);

// 页面进入后台时暂停循环，回到前台时恢复。
document.addEventListener(
  'visibilitychange',
  () => {
    if (document.hidden) {
      if (raf) {
        cancelAnimationFrame(raf);
        raf = 0;
      }
    } else if (running && !raf) {
      raf = requestAnimationFrame(detectLoop);
    }
  }
);

// 页面卸载时释放摄像头资源。
window.addEventListener(
  'beforeunload',
  () => {
    running = false;

    if (raf) {
      cancelAnimationFrame(raf);
      raf = 0;
    }

    if (stream) {
      stream.getTracks().forEach(track => {
        track.stop();
      });

      stream = null;
    }
  }
);

// 初始化按钮状态与缩放显示。
setZoom();
updateButtons();

})();
</script>
</body>
</html>
