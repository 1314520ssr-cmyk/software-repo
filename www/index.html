<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>动态锁定</title>
<style>
*{margin:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:transparent;color:#fff;font-family:system-ui,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%}
#bt{position:fixed;right:calc(18px + env(safe-area-inset-right));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px}
#bt button{width:112px;height:54px;border-radius:12px;border:2px solid #fff;background:rgba(0,0,0,.5);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
#bl.on{background:rgba(255,60,60,.65)}
#bz.on{background:rgba(30,190,90,.65)}
#bl.off{opacity:.35}
#ov{position:fixed;inset:0;background:#0b1020;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
#go{border:0;border-radius:30px;padding:14px 44px;font-size:20px;font-weight:700;background:#ff4d4d;color:#fff}
#go:disabled{opacity:.5}
#ms{font-size:14px;color:#9fb0e0;max-width:80%;line-height:1.5}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bt">
<button id="bl"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span>锁定</span></button>
<button id="bz"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10" cy="10" r="6"/><path d="M15 15l5 5M10 7v6M7 10h6"/></svg><span>变焦</span></button>
<button id="bs"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 12h8"/></svg><span>仅运动</span></button>
</div>
<div id="ov"><div style="font-size:26px;font-weight:800">动态锁定</div><div id="ms">原生相机加 AI 识别画面里的人、车、动物等物体，只框出正在移动的。点方框选目标，再按右边按钮锁定或变焦。</div><button id="go">开始</button></div>
<script>
const $=i=>document.getElementById(i);
const CN=('person:人,bicycle:自行车,car:轿车,motorcycle:摩托车,airplane:飞机,bus:公交车,train:火车,truck:卡车,boat:船,traffic light:红绿灯,fire hydrant:消防栓,stop sign:停车标志,parking meter:停车计时器,bench:长椅,bird:鸟,cat:猫,dog:狗,horse:马,sheep:羊,cow:牛,elephant:大象,bear:熊,zebra:斑马,giraffe:长颈鹿,backpack:背包,umbrella:雨伞,handbag:手提包,tie:领带,suitcase:行李箱,frisbee:飞盘,skis:滑雪板,snowboard:单板,sports ball:球,kite:风筝,baseball bat:球棒,baseball glove:棒球手套,skateboard:滑板,surfboard:冲浪板,tennis racket:网球拍,bottle:瓶子,wine glass:酒杯,cup:杯子,fork:叉子,knife:刀,spoon:勺子,bowl:碗,banana:香蕉,apple:苹果,sandwich:三明治,orange:橙子,broccoli:西兰花,carrot:胡萝卜,hot dog:热狗,pizza:披萨,donut:甜甜圈,cake:蛋糕,chair:椅子,couch:沙发,potted plant:盆栽,bed:床,dining table:餐桌,toilet:马桶,tv:电视,laptop:笔记本电脑,mouse:鼠标,remote:遥控器,keyboard:键盘,cell phone:手机,microwave:微波炉,oven:烤箱,toaster:烤面包机,sink:水槽,refrigerator:冰箱,book:书,clock:时钟,vase:花瓶,scissors:剪刀,teddy bear:玩具熊,hair drier:吹风机,toothbrush:牙刷').split(',').reduce((m,s)=>{const p=s.split(':');m[p[0]]=p[1];return m},{});
const SZ={person:[1.7,'h'],car:[1.8,'w'],truck:[2.5,'w'],bus:[2.5,'w'],bicycle:[1.7,'w'],motorcycle:[2,'w'],dog:[.5,'h'],cat:[.3,'h'],horse:[1.6,'h'],cow:[1.4,'h']};

/* ---------- 状态（摄像头、AI 和跟踪都在原生部分运行，这里只负责显示）---------- */
const VW=1280,VH=720;
let W=0,H=0,s0=1,z=1,cvx=VW/2,cvy=VH/2,mstat='',sel=0,lk=0,zm=0,zlost=0,ai='AI：加载中…',aps=0,dps=0,nt=0,note='',T0=0,showAll=false,lastV='';
const TV=new Map(),cvs=$('c'),X=cvs.getContext('2d',{desynchronized:true});
function rs(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cvs.width=W*d;cvs.height=H*d;X.setTransform(d,0,0,d,0,0);s0=Math.max(W/VW,H/VH)}
addEventListener('resize',rs);rs();
const say=t=>$('ms').textContent=t;
function toast(t){note=t;nt=2}
function ui(){
  $('bl').lastChild.textContent=lk?'取消锁定':'锁定';$('bl').className=(lk?'on ':'')+(zm?'off':'');
  $('bz').lastChild.textContent=zm?'取消变焦':'变焦';$('bz').className=zm?'on':'';
  $('bs').lastChild.textContent=showAll?'显示全部':'仅运动';
}
function pins(){const ids=[lk,zm,sel].filter(Boolean);if(window.Android&&Android.pins)Android.pins(ids.join(','))}
  window.nativeTracks=function(r){
  const now=performance.now(),seen=new Set();
  mstat=r.st;ai=r.ai;aps=r.aps;dps=r.dps;
  r.tr.forEach(o=>{
    let v=TV.get(o.id);
    if(!v){v={id:o.id,cx:0,cy:0,sd:0,first:true,dist:0};TV.set(o.id,v)}
    v.tx=o.x+o.w/2;v.ty=o.y+o.h/2;v.ts=Math.max(o.w,o.h)*1.04+3;v.vx=o.vx;v.vy=o.vy;v.t=now;
    v.cls=o.c;v.sc=o.s;v.mv=!!o.m;v.at=o.a>=0?now-o.a:-1e9;v.w=o.w;v.h=o.h;seen.add(o.id);
    if(v.first){v.cx=v.tx;v.cy=v.ty;v.sd=v.ts;v.first=false}
    const z0=SZ[o.c];
    if(z0){const px=z0[1]==='h'?v.h:v.w,m=z0[0]*VW*.77/px;v.dist=v.dist?v.dist*.8+m*.2:m}
  });
  TV.forEach((v,id)=>{if(!seen.has(id))TV.delete(id)});
};
window.nativeReady=function(){$('ov').style.display='none';ui()};
window.nativeError=function(m){say('出错：'+m);const b=$('go');b.disabled=false;b.textContent='重试'};

/* ---------- 显示与交互 ---------- */
const S=(x,y)=>[W/2+(x-cvx)*s0*z,H/2+(y-cvy)*s0*z];
const vis=now=>{const a=[];TV.forEach(v=>{if(zm?v.id===zm:(showAll||v.mv||now-v.at<2000||v.id===lk||v.id===sel))a.push(v)});return a};
function corners(x,y,s,col,lw){
  const l=s*.22,h=s/2;X.strokeStyle=col;X.lineWidth=lw;X.beginPath();
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(q=>{const a=x+q[0]*h,b=y+q[1]*h;X.moveTo(a,b-q[1]*l);X.lineTo(a,b);X.lineTo(a-q[0]*l,b)});
  X.stroke();
}
function draw(dt,now){
  const a=1-Math.exp(-dt*40);
  TV.forEach(v=>{
    const e=Math.max(0,Math.min(.12,(now-v.t)/1000));
    v.cx+=(v.tx+v.vx*e-v.cx)*a;v.cy+=(v.ty+v.vy*e-v.cy)*a;v.sd+=(v.ts-v.sd)*a;
  });
  if(sel&&!TV.has(sel)){sel=0;pins()}
  if(lk&&!TV.has(lk)){lk=0;toast('锁定目标丢失');ui();pins()}
  let tz=1,tx=VW/2,ty=VH/2;
  if(zm){
    const t=TV.get(zm);
    if(t){zlost=0;tz=Math.max(1.5,Math.min(6,.42*H/(t.sd*s0)));tx=t.cx;ty=t.cy}
    else{zlost+=dt;tz=z;tx=cvx;ty=cvy;if(zlost>3){zm=0;toast('目标丢失，已退出变焦');ui();pins()}}
  }
  z+=(tz-z)*(1-Math.exp(-dt*6));
  const hw=Math.min(VW/2,W/(2*s0*z)),hh=Math.min(VH/2,H/(2*s0*z));
  cvx+=(Math.max(hw,Math.min(VW-hw,tx))-cvx)*(1-Math.exp(-dt*12));
  cvy+=(Math.max(hh,Math.min(VH-hh,ty))-cvy)*(1-Math.exp(-dt*12));
  const vk=(-(cvx-VW/2)*s0*z).toFixed(1)+','+(-(cvy-VH/2)*s0*z).toFixed(1)+','+z.toFixed(3);
  if(vk!==lastV&&window.Android&&Android.view){Android.view(-(cvx-VW/2)*s0*z,-(cvy-VH/2)*s0*z,z);lastV=vk}
  X.clearRect(0,0,W,H);X.textBaseline='middle';X.textAlign='left';
  const vs=vis(now);
  vs.forEach(t=>{
    const p=S(t.cx,t.cy),s=Math.max(26,t.sd*s0*z),isL=t.id===lk,isZ=t.id===zm,isS=t.id===sel;
    const col=isL?'#ff3b3b':isZ?'#2fe06b':isS?'#ffd24a':lk||zm?'rgba(255,255,255,.4)':t.mv?'#7fe9ff':'rgba(255,255,255,.5)';
    if(p[0]<-s||p[0]>W+s||p[1]<-s||p[1]>H+s){
      if(isZ){const an=Math.atan2(p[1]-H/2,p[0]-W/2),ex=W/2+Math.cos(an)*(W/2-36),ey=H/2+Math.sin(an)*(H/2-36);
        X.fillStyle=col;X.beginPath();X.moveTo(ex+Math.cos(an)*18,ey+Math.sin(an)*18);X.lineTo(ex+Math.cos(an+2.5)*14,ey+Math.sin(an+2.5)*14);X.lineTo(ex+Math.cos(an-2.5)*14,ey+Math.sin(an-2.5)*14);X.fill()}
      return;
    }
    corners(p[0],p[1],s,col,isL||isZ?4:2);
    if(isS||isL||isZ){X.strokeStyle=col;X.lineWidth=1;X.setLineDash([6,6]);X.strokeRect(p[0]-s/2,p[1]-s/2,s,s);X.setLineDash([])}
    X.font='bold 13px sans-serif';X.fillStyle=col;
    X.fillText('#'+t.id+' '+(CN[t.cls]||t.cls)+(t.mv?'':'（静止）'),p[0]-s/2,p[1]-s/2-10);
    X.fillText(t.dist?'约'+t.dist.toFixed(t.dist<10?1:0)+'m':(t.sd/VH>.4?'近':t.sd/VH>.15?'中':'远')+'(估)',p[0]-s/2,p[1]+s/2+12);
  });
  X.font='13px sans-serif';X.fillStyle='#fff';
  X.fillText('跟踪 '+aps+'次/秒 · 识别 '+dps+'次/秒 · 目标 '+vs.length+' · '+mstat,40,20);
  X.fillText(ai+(zm?' · 变焦 x'+z.toFixed(1):''),40,40);
  if(!lk&&!zm)X.fillText(sel?'已选中 #'+sel+'，按右侧按钮':'点方框选择目标',40,H-20);
  if(nt>0){nt-=dt;X.textAlign='center';X.font='bold 18px sans-serif';X.fillText(note,W/2,H-44)}
}
cvs.addEventListener('pointerdown',e=>{
  let b=null,bs=1e9;
  vis(performance.now()).forEach(t=>{
    const p=S(t.cx,t.cy),s=Math.max(26,t.sd*s0*z)/2+14;
    if(Math.abs(e.clientX-p[0])<s&&Math.abs(e.clientY-p[1])<s&&s<bs){b=t;bs=s}
  });
  sel=b?b.id:0;pins();
});
$('bl').onclick=()=>{
  if(zm)return toast('变焦中不能单独锁定，请先取消变焦');
  if(lk){lk=0;toast('已取消锁定')}else if(sel){lk=sel;toast('已锁定 #'+lk)}else toast('先点一个方框选目标');
  ui();pins();
};
$('bz').onclick=()=>{
  if(zm){zm=0;zlost=0;toast('已取消变焦')}else if(sel){zm=sel;lk=0;zlost=0;toast('变焦锁定 #'+zm)}else toast('先点一个方框选目标');
  ui();pins();
};
$('bs').onclick=()=>{showAll=!showAll;toast(showAll?'显示全部识别到的物体':'只显示正在移动的物体');ui()};
function frame(t){
  const dt=Math.min(.05,(t-T0)/1000||.016);T0=t;draw(dt,performance.now());requestAnimationFrame(frame);
  }
$('go').onclick=()=>{
  if(!window.Android){say('请在安装好的 App 中使用');return}
  const b=$('go');b.disabled=true;
  say('正在启动摄像头和 AI…（弹出权限请求请点允许）');
  Android.start();
};
ui();
requestAnimationFrame(frame);
</script>
</body>
</html>
