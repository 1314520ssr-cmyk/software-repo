name: b

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  b:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download and verify AI dependencies
        shell: bash
        run: |
          set -euo pipefail

          MODEL_URL="https://storage.googleapis.com/tfjs-models/savedmodel/ssdlite_mobilenet_v2"

          mkdir -p www/model

          echo "Downloading TensorFlow.js browser bundle..."
          curl -fLsS --retry 3 \
            "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js" \
            -o www/tf.min.js

          echo "Downloading COCO-SSD browser bundle..."
          curl -fLsS --retry 3 \
            "https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js" \
            -o www/coco.min.js

          test -s www/tf.min.js
          test -s www/coco.min.js

          node <<'NODE'
          const fs = require('fs');

          for (const file of ['www/tf.min.js', 'www/coco.min.js']) {
            const content = fs.readFileSync(file, 'utf8');

            if (content.length < 1000) {
              throw new Error(`${file} appears too small`);
            }

            if (content.trimStart().startsWith('<')) {
              throw new Error(`${file} contains HTML, not JavaScript`);
            }

            console.log(`${file}: ${content.length} characters`);
          }
          NODE

          echo "Downloading model configuration..."
          curl -fLsS --retry 3 \
            "$MODEL_URL/model.json" \
            -o www/model/model.json

          node <<'NODE'
          const fs = require('fs');

          const model = JSON.parse(
            fs.readFileSync('www/model/model.json', 'utf8')
          );

          if (!Array.isArray(model.weightsManifest) ||
              model.weightsManifest.length === 0) {
            throw new Error('Model JSON has no weightsManifest');
          }

          const paths = [
            ...new Set(
              model.weightsManifest.flatMap(group => group.paths || [])
            )
          ];

          if (paths.length === 0) {
            throw new Error('Model JSON contains no weight paths');
          }

          for (const p of paths) {
            if (
              typeof p !== 'string' ||
              p.startsWith('/') ||
              p.includes('..') ||
              p.includes('\\')
            ) {
              throw new Error(`Invalid model weight path: ${p}`);
            }
          }

          fs.writeFileSync(
            'weights-list.txt',
            paths.join('\n') + '\n'
          );

          console.log('Weight files:', paths.length);
          NODE

          while IFS= read -r file; do
            [ -n "$file" ] || continue

            echo "Downloading weight: $file"

            mkdir -p "www/model/$(dirname "$file")"

            curl -fLsS --retry 3 \
              "$MODEL_URL/$file" \
              -o "www/model/$file"

            test -s "www/model/$file"

            node -e '
              const fs = require("fs");
              const file = process.argv[1];
              const data = fs.readFileSync(file);

              if (data.length < 4) {
                console.error("Weight file too small:", file);
                process.exit(1);
              }

              if (data.length % 4 !== 0) {
                console.log(
                  "WARNING: Byte length is not divisible by 4:",
                  file,
                  data.length
                );
              }
            ' "www/model/$file"

          done < weights-list.txt

          echo "Verifying model weight files..."
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const model = JSON.parse(
            fs.readFileSync('www/model/model.json', 'utf8')
          );

          let total = 0;

          for (const group of model.weightsManifest) {
            for (const weight of group.paths || []) {
              const file = path.join('www/model', weight);

              if (!fs.existsSync(file)) {
                throw new Error(`Missing model weight: ${file}`);
              }

              const size = fs.statSync(file).size;

              if (size === 0) {
                throw new Error(`Empty model weight: ${file}`);
              }

              total += size;
            }
          }

          console.log('Total weight bytes:', total);
          console.log('Model file checks passed.');
          NODE- name: Install Capacitor
        shell: bash
        run: |
          set -euo pipefail

          npm init -y

          npm install \
            @capacitor/core@6 \
            @capacitor/cli@6 \
            @capacitor/android@6

          cat > capacitor.config.json <<'CONFIG'
          {
            "appId": "com.motionlock.app",
            "appName": "动态锁定",
            "webDir": "www"
          }
          CONFIG

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail

          npx cap add android

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          sed -i \
            '0,/<activity/s//<activity android:screenOrientation="landscape"/' \
            "$MANIFEST"

          sed -i \
            's#<application#<uses-permission android:name="android.permission.CAMERA" />\n<uses-permission android:name="android.permission.VIBRATE" />\n<application#' \
            "$MANIFEST"

          cat > android/app/src/main/java/com/motionlock/app/MainActivity.java <<'JAVA'
          package com.motionlock.app;

          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              hideSystemUI();
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) hideSystemUI();
            }

            private void hideSystemUI() {
              getWindow().getDecorView().setSystemUiVisibility(
                View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                | View.SYSTEM_UI_FLAG_FULLSCREEN
                | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
              );

              if (Build.VERSION.SDK_INT >= 28) {
                WindowManager.LayoutParams params = getWindow().getAttributes();
                params.layoutInDisplayCutoutMode =
                  WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                getWindow().setAttributes(params);
              }

              getWindow().addFlags(
                WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
              );
            }
          }
          JAVA

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 动态锁定 - 最新构建
          body: |
            自动构建的 Android Debug APK。
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
