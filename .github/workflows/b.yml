name: b
on: push
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          echo '{"appId":"com.motionlock.app","appName":"动态锁定","webDir":"www"}' > capacitor.config.json
          npx cap add android
          sed -i '0,/<activity/s//<activity android:screenOrientation="landscape"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n<uses-feature android:name="android.hardware.camera" android:required="false" />\n<application#' android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/' android/variables.gradle
          printf '%s\n' '    implementation "com.google.mediapipe:tasks-vision:0.10.18"' '    implementation "androidx.camera:camera-core:1.3.4"' '    implementation "androidx.camera:camera-camera2:1.3.4"' '    implementation "androidx.camera:camera-lifecycle:1.3.4"' '    implementation "androidx.camera:camera-view:1.3.4"' > deps.txt
          sed -i '/^dependencies {/r deps.txt' android/app/build.gradle
          sed -i '/^android {/a\    aaptOptions { noCompress "tflite" }' android/app/build.gradle
          mkdir -p android/app/src/main/assets
          curl -fsSL -o android/app/src/main/assets/efficientdet_lite0.tflite https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite
          cp native/*.java android/app/src/main/java/com/motionlock/app/
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: android/app/build/outputs/apk/debug/app-debug.apk
