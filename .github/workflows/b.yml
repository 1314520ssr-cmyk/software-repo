name: b
on: push
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: |
          B=https://storage.googleapis.com/tfjs-models/savedmodel/ssdlite_mobilenet_v2
          mkdir -p www/model
          curl -fsSL -o www/tf.min.js https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0
          curl -fsSL -o www/coco.min.js https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3
          curl -fsSL -o www/model/model.json $B/model.json
          node -e "const fs=require('fs'),p='www/model/model.json',j=JSON.parse(fs.readFileSync(p)),n=[];j.weightsManifest.forEach(m=>m.paths=m.paths.map(x=>{n.push(x);return x+'.bin'}));fs.writeFileSync(p,JSON.stringify(j));fs.writeFileSync('names.txt',n.join(' '))"
          for f in $(cat names.txt); do curl -fsSL -o www/model/$f.bin $B/$f; done
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          echo '{"appId":"com.motionlock.app","appName":"动态锁定","webDir":"www"}' > capacitor.config.json
          npx cap add android
          sed -i '0,/<activity/s//<activity android:screenOrientation="landscape"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n<uses-permission android:name="android.permission.VIBRATE" />\n<application#' android/app/src/main/AndroidManifest.xml
          cat > android/app/src/main/java/com/motionlock/app/MainActivity.java <<'JAVA'
          package com.motionlock.app;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle b) { super.onCreate(b); hide(); }
            @Override public void onWindowFocusChanged(boolean f) { super.onWindowFocusChanged(f); if (f) hide(); }
            private void hide() {
              getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
              if (Build.VERSION.SDK_INT >= 28) {
                WindowManager.LayoutParams p = getWindow().getAttributes();
                p.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                getWindow().setAttributes(p);
              }
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
            }
          }
          JAVA
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: android/app/build/outputs/apk/debug/app-debug.apk
